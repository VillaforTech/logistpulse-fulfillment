services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    volumes:
    - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    ports:
    - ${PROMETHEUS_PORT:-29090}:9090
    networks:
    - logist
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Run scripts/configure.py}
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:-http://localhost:28080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_LIVE_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost:28080},http://localhost:28080,http://localhost:23000
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: logistpulse-business-panel
    volumes:
    - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
    - ./observability/grafana/plugins:/var/lib/grafana/plugins:ro
    ports:
    - ${GRAFANA_PORT:-23000}:3000
    networks:
    - logist
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://localhost:3000/api/health
      interval: 3s
      timeout: 3s
      retries: 30
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    privileged: true
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    - /dev/disk:/dev/disk:ro
    ports:
    - ${CADVISOR_PORT:-28088}:8080
    networks:
    - logist
    profiles:
    - resources
volumes:
  grafana_data: {}
  prometheus_data: {}
