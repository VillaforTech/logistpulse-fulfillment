name: logistpulse-reference
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py}
      POSTGRES_DB: postgres
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:?Run scripts/configure.py}
    volumes:
    - pg_data:/var/lib/postgresql/data
    - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-logist} -d postgres
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - logist
    mem_limit: 512m
    cpus: 1
  mongo:
    image: mongo:8.0
    volumes:
    - mongo_data:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping').ok
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
    - logist
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
    - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
    - logist
  redpanda:
    image: redpandadata/redpanda:v24.3.18
    command:
    - redpanda
    - start
    - --overprovisioned
    - --smp
    - '1'
    - --memory
    - 512M
    - --reserve-memory
    - 0M
    - --node-id
    - '0'
    - --check=false
    - --kafka-addr
    - PLAINTEXT://0.0.0.0:9092
    - --advertise-kafka-addr
    - PLAINTEXT://redpanda:9092
    networks:
    - logist
    volumes:
    - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test:
      - CMD
      - rpk
      - cluster
      - health
      - --exit-when-healthy
      interval: 3s
      timeout: 5s
      retries: 30
  inventory-api:
    build: ./services/inventory-api
    environment:
      INVENTORY_DB_URL: postgresql://${POSTGRES_USER:-logist}:${POSTGRES_PASSWORD:?Run
        scripts/configure.py}@postgres:5432/inventory_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: &id001
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
    - logist
  logistics-api:
    build: ./services/logistics-api
    environment:
      LOGISTICS_DB_URL: postgresql://${POSTGRES_USER:-logist}:${POSTGRES_PASSWORD:?Run
        scripts/configure.py}@postgres:5432/logistics_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *id001
    networks:
    - logist
  operations-api:
    build: ./services/operations-api
    environment:
      MONGO_URI: mongodb://mongo:27017
      MQTT_HOST: mosquitto
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck: *id001
    networks:
    - logist
  telemetry-simulator:
    build: ./services/telemetry-simulator
    environment:
      MQTT_HOST: mosquitto
    depends_on:
    - mosquitto
    networks:
    - logist
  fulfillment-api:
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
      target: runtime
    command:
    - uvicorn
    - logist.fulfillment:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      FULFILLMENT_DB_URL: postgresql://${POSTGRES_USER:-logist}:${POSTGRES_PASSWORD:?Run
        scripts/configure.py}@postgres:5432/fulfillment_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *id001
    networks:
    - logist
  fulfillment-worker:
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
      target: runtime
    command:
    - uvicorn
    - logist.worker:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      FULFILLMENT_DB_URL: postgresql://${POSTGRES_USER:-logist}:${POSTGRES_PASSWORD:?Run
        scripts/configure.py}@postgres:5432/fulfillment_db
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck: *id001
    networks:
    - logist
  console:
    image: nginx:1.27-alpine
    volumes:
    - ./frontend:/usr/share/nginx/html:ro
    - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - ${CONSOLE_PORT:-28080}:8080
    depends_on:
      inventory-api:
        condition: service_healthy
      logistics-api:
        condition: service_healthy
      operations-api:
        condition: service_healthy
      fulfillment-api:
        condition: service_healthy
      business-analytics:
        condition: service_healthy
    networks:
    - logist
  outbox-relay:
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
      target: runtime
    command:
    - uvicorn
    - logist.relay:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      FULFILLMENT_DB_URL: postgresql://${POSTGRES_USER:-logist}:${POSTGRES_PASSWORD:?Run
        scripts/configure.py}@postgres:5432/fulfillment_db
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck: *id001
    networks:
    - logist
  business-analytics:
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
      target: runtime
    command:
    - uvicorn
    - logist.analytics:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      ANALYTICS_DB_URL: postgresql://analytics:${ANALYTICS_PASSWORD:?Run scripts/configure.py}@postgres:5432/analytics_db
      FULFILLMENT_URL: http://fulfillment-api:8000
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      fulfillment-api:
        condition: service_healthy
    healthcheck: *id001
    networks:
    - logist
  grafana-live-adapter:
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
      target: runtime
    command:
    - uvicorn
    - logist.live:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      ANALYTICS_URL: http://business-analytics:8000
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GRAFANA_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Run scripts/configure.py}
    depends_on:
      business-analytics:
        condition: service_healthy
    healthcheck: *id001
    networks:
    - logist
  database-tests:
    profiles:
    - test
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
      target: test
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      FULFILLMENT_DB_URL: postgresql://${POSTGRES_USER:-logist}:${POSTGRES_PASSWORD:?Run
        scripts/configure.py}@postgres:5432/fulfillment_db
      ANALYTICS_DB_URL: postgresql://analytics:${ANALYTICS_PASSWORD:?Run scripts/configure.py}@postgres:5432/analytics_db
      FULFILLMENT_URL: http://fulfillment-api:8000
      RUN_DATABASE_TESTS: '1'
    volumes:
    - ./artifacts:/artifacts
    networks:
    - logist
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
networks:
  logist: {}
volumes:
  pg_data: null
  mongo_data: null
  redpanda_data: {}
