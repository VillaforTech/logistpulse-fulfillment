map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s;
  location /api/inventory/ { proxy_pass http://inventory-api:8000; }
  location /api/distribution/ { proxy_pass http://logistics-api:8000; }
  location /api/operations/ { proxy_pass http://operations-api:8000; }
  location /api/fulfillment/ { proxy_pass http://fulfillment-api:8000; }
  location /api/business/ {
    proxy_pass http://business-analytics:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
  location /grafana/ {
    set $grafana_upstream http://grafana:3000;
    proxy_pass $grafana_upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
  location /health/inventory { proxy_pass http://inventory-api:8000/health; }
  location /health/logistics { proxy_pass http://logistics-api:8000/health; }
  location /health/operations { proxy_pass http://operations-api:8000/health; }
  location /health/fulfillment { proxy_pass http://fulfillment-api:8000/health; }
  location /health/worker { proxy_pass http://fulfillment-worker:8000/health; }
  location /health/relay { proxy_pass http://outbox-relay:8000/health; }
  location /health/analytics { proxy_pass http://business-analytics:8000/health; }
  location /health/live { proxy_pass http://grafana-live-adapter:8000/health; }
}
